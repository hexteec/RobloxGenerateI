<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Tokens — RoPeak</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #E8EEEE;
      --card: #FFFFFF;
      --soft: #F1F5F5;
      --soft-2: #DCE5E5;
      --border: #D0DBDB;
      --ink: #172124;
      --ink-2: #222D30;
      --ink-muted: #536468;
      --ink-faint: #8FA1A4;

      --gridColor: rgba(28, 33, 39, 0.055);
      --Check-1: #E8EEEE;
      --Check-2: #EDF2F2;

      --accent: #0F6B73;
      --accent-deep: #0B5359;
      --accent-wash: #DDEDEE;

      --mint: #287F47;
      --mint-wash: #E4F1E8;
      --coral: #C4281C;
      --amber: #A87A2A;
      --amber-wash: #F6EFE1;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --shadow-sm: 0 1px 0 rgba(28, 33, 39, 0.06);
      --shadow-md: 0 2px 0 var(--edge);
      --shadow-lg: 0 2px 0 var(--edge), 0 18px 34px -16px rgba(28, 33, 39, 0.28);

      --font-display: 'Schibsted Grotesk', system-ui, sans-serif;
      --font-body: 'Schibsted Grotesk', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      --on-accent: #ffffff;
      --edge: #CDD8D8;
    }

    [data-theme="dark"] {
      --bg: #151B1D;
      --card: #1E272A;
      --soft: #253033;
      --soft-2: #2F3B3F;
      --border: #36444A;
      --ink: #E6EEEF;
      --ink-2: #D2DDDF;
      --ink-muted: #9DB0B3;
      --ink-faint: #66797D;
      --gridColor: rgba(255, 255, 255, 0.035);
      --Check-1: #151B1D;
      --Check-2: #182022;
      --accent: #4DB6BE;
      --accent-deep: #7FCDD3;
      --accent-wash: #15302F;
      --mint: #5BB47F;
      --mint-wash: #1C2E23;
      --coral: #E5675C;
      --amber: #D3A657;
      --amber-wash: #332A1A;
      --shadow-sm: 0 1px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 2px 0 var(--edge);
      --shadow-lg: 0 2px 0 var(--edge), 0 18px 34px -14px rgba(0, 0, 0, 0.6);
      --on-accent: #0A1B1D;
      --edge: #0C1112;
    }

    [data-theme="sea"] {
      --bg: #F3F7F9;
      --card: #FFFFFF;
      --soft: #E7EFF3;
      --soft-2: #D8E5EB;
      --border: #D3E1E8;
      --ink: #172A32;
      --ink-2: #20333b;
      --ink-muted: #556E78;
      --ink-faint: #93A9B1;
      --gridColor: rgba(64, 68, 70, 0.055);
      --Check-1: #f1f4f5;
      --Check-2: #f9fafa;
      --accent: #1E7A8C;
      --accent-deep: #16606F;
      --accent-wash: #DFF0F3;
      --mint: #2E8F72;
      --mint-wash: #E1F3EC;
      --coral: #C25A45;
      --amber: #B08A2E;
      --amber-wash: #F3EDDD;
      --shadow-sm: 0 1px 0 rgba(20, 30, 30, 0.06);
      --shadow-md: 0 2px 0 var(--edge);
      --shadow-lg: 0 2px 0 var(--edge), 0 18px 34px -16px rgba(20, 30, 30, 0.26);
    }

    [data-theme="forest"] {
      --bg: #F5F7F2;
      --card: #FFFFFF;
      --soft: #EAEEE3;
      --soft-2: #DCE3D2;
      --border: #D8E0CD;
      --ink: #232B1D;
      --ink-2: #343b2e;
      --ink-muted: #5F6B54;
      --ink-faint: #97A188;
      --gridColor: rgba(64, 70, 65, 0.055);
      --Check-1: #f1f5f1;
      --Check-2: #f9faf9;
      --accent: #4C7A3F;
      --accent-deep: #3B6130;
      --accent-wash: #E6EEE0;
      --mint: #397A63;
      --mint-wash: #E2F0EA;
      --coral: #B0553A;
      --amber: #A8842C;
      --amber-wash: #F2ECDA;
      --shadow-sm: 0 1px 0 rgba(20, 30, 30, 0.06);
      --shadow-md: 0 2px 0 var(--edge);
      --shadow-lg: 0 2px 0 var(--edge), 0 18px 34px -16px rgba(20, 30, 30, 0.26);
    }

    [data-theme="sun"] {
      --bg: #FCF8F1;
      --card: #FFFFFF;
      --soft: #F5EDDC;
      --soft-2: #EEE1C6;
      --border: #EBDFC4;
      --ink: #2C2210;
      --ink-2: #3d321e;
      --ink-muted: #75674C;
      --ink-faint: #AB9C7C;
      --gridColor: rgba(70, 68, 64, 0.055);
      --Check-1: #f5f3f1;
      --Check-2: #faf9f9;
      --accent: #C97A25;
      --accent-deep: #A6621A;
      --accent-wash: #F8E9D2;
      --mint: #3E7A5F;
      --mint-wash: #E7F1EA;
      --coral: #C1502F;
      --amber: #C1911F;
      --amber-wash: #F7EBCE;
      --shadow-sm: 0 1px 0 rgba(20, 30, 30, 0.06);
      --shadow-md: 0 2px 0 var(--edge);
      --shadow-lg: 0 2px 0 var(--edge), 0 18px 34px -16px rgba(20, 30, 30, 0.26);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
      background-image:
        linear-gradient(var(--gridColor) 1px, transparent 1px),
        linear-gradient(90deg, var(--gridColor) 1px, transparent 1px),
        conic-gradient(var(--Check-1) 90deg, var(--Check-2) 90deg 180deg, var(--Check-1) 180deg 270deg, var(--Check-2) 270deg);
      background-size: 30px 30px, 30px 30px, 240px 240px;
      background-position: 0 0, 0 0, 0 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
    }

    button {
      font-family: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(.97);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* ---------------- Top nav ---------------- */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: transparent;
      border-bottom: 1px solid transparent;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 12px;
      flex-wrap: wrap;
      row-gap: 8px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      cursor: pointer;
      color: var(--ink);
      flex-shrink: 0;
    }

    .nav-brand .mark {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .nav-brand .mark svg {
      width: 26px;
      height: 26px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-back {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 6px;
      transition: color .15s ease;
      flex-shrink: 0;
    }

    .nav-back:hover {
      color: var(--ink);
    }

    .nav-back svg {
      width: 14px;
      height: 14px;
    }

    /* Keys, not pills: the same pressable plastic as in the app. */
    .btn-google-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px 10px;
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 0 var(--edge);
      cursor: pointer;
      transition: transform .45s cubic-bezier(.34, 1.9, .5, 1);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-google-nav:active { transform: scale(.95, .9); transition-duration: .08s; }

    .btn-google-nav svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .user-row-nav {
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .user-row-nav.show {
      display: flex;
    }

    .u-avatar-nav {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--soft-2);
      flex-shrink: 0;
    }

    .token-balance {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: var(--card);
      padding: 7px 12px 8px 10px;
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 0 var(--edge);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: default;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .token-balance svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .btn-signout {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 0;
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 0 var(--edge);
      color: var(--ink-muted);
      cursor: pointer;
      transition: color .15s ease;
      flex-shrink: 0;
    }

    .btn-signout:hover { color: var(--coral); }

    .btn-signout svg {
      width: 14px;
      height: 14px;
    }

    /* ---------------- Header ---------------- */
    .hero {
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 24px 0;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(30px, 7vw, 42px);
      letter-spacing: -0.025em;
      line-height: 1.05;
      margin: 0 0 12px;
      color: var(--ink);
    }

    .hero p {
      color: var(--ink-muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
      max-width: 46ch;
    }

    .hero p b { color: var(--ink); font-weight: 600; }

    /* ---------------- Packages ----------------
       One ledger, ruled like the one in the app's top-up window: a stack
       of coins that grows by one per step, the amount, what a token comes
       to, and the price. The savings are computed, not labelled. */
    .packages-wrap {
      max-width: 560px;
      margin: 30px auto 0;
      padding: 0 24px;
    }

    .packages-list {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: 0 3px 0 var(--edge);
      overflow: hidden;
    }

    .pkg-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px 16px 18px;
      border: 0;
      border-top: 1px solid var(--soft-2);
      background: none;
      font: inherit;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .15s ease;
    }

    .pkg-row:first-child { border-top: 0; }
    .pkg-row:hover { background: var(--soft); }
    .pkg-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .pkg-row.best { background: var(--accent-wash); }
    .pkg-row.best:hover { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }

    .p-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 2px;
      height: 30px;
    }

    .p-stack i {
      display: block;
      width: 20px;
      height: 4px;
      border-radius: 2px;
      background: var(--ink-faint);
      transition: transform .45s cubic-bezier(.34, 1.9, .5, 1);
    }

    .p-stack i:nth-child(even) { transform: translateX(2px); }
    .pkg-row:hover .p-stack i:last-child { transform: translateY(-3px); }
    .pkg-row.best .p-stack i { background: var(--accent); }

    .p-main { min-width: 0; }

    .p-amount {
      display: block;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .p-amount b {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-right: 4px;
    }

    .p-meta {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    .p-meta em {
      font-style: normal;
      font-weight: 600;
      color: var(--accent-deep);
    }

    .p-price {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
      white-space: nowrap;
    }

    .note-row {
      max-width: 560px;
      margin: 18px auto 90px;
      padding: 0 24px;
      color: var(--ink-muted);
      font-size: 12.5px;
    }

    /* ---------------- Toast / status ---------------- */
    .status-toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 11px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 90;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .status-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .status-toast.error {
      background: var(--coral);
    }

    /* ---------------- Theme dots (subtle, in nav) ---------------- */
    .theme-switch {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-right: 4px;
    }

    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      cursor: pointer;
      padding: 0;
      position: relative;
      flex-shrink: 0;
      transition: transform .12s ease, border-color .15s ease;
    }

    .theme-dot:hover {
      border-color: var(--ink-faint);
    }

    .theme-dot.active::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
    }

    .theme-dot[data-theme-id="light"] {
      background: linear-gradient(135deg, #E8EEEE 50%, #0F6B73 50%);
    }

    .theme-dot[data-theme-id="dark"] {
      background: linear-gradient(135deg, #151B1D 50%, #4DB6BE 50%);
    }

    .theme-dot[data-theme-id="sea"] {
      background: linear-gradient(135deg, #F3F7F9 50%, #1E7A8C 50%);
    }

    .theme-dot[data-theme-id="forest"] {
      background: linear-gradient(135deg, #F5F7F2 50%, #4C7A3F 50%);
    }

    .theme-dot[data-theme-id="sun"] {
      background: linear-gradient(135deg, #FCF8F1 50%, #C97A25 50%);
    }

    /* ---------------- Responsive ---------------- */

    @media (max-width: 700px) {
      .btn-google-nav .btn-label {
        display: none;
      }

      .btn-google-nav {
        padding: 9px 11px;
      }

      .nav-back .nav-back-label {
        display: none;
      }

      .nav-back {
        padding: 8px;
      }
    }

    @media (max-width: 620px) {
      .nav {
        padding: 14px 16px;
      }

      .theme-switch {
        display: none;
      }

      .hero {
        padding: 40px 18px 28px;
      }

      .hero p {
        font-size: 13.5px;
      }


      .packages-wrap {
        margin-top: 30px;
        padding: 0 18px;
      }

      .pkg-row {
        padding: 14px 16px 14px 14px;
        gap: 12px;
      }

      .note-row {
        margin: 16px auto 70px;
        padding: 0 18px;
      }
    }

    @media (max-width: 420px) {
      .nav {
        padding: 12px 14px;
        gap: 8px;
      }

      .nav-right {
        gap: 6px;
      }

      .nav-brand {
        font-size: 14px;
      }

      .token-balance {
        font-size: 12px;
        padding: 6px 10px 6px 9px;
      }

      .u-avatar-nav {
        width: 26px;
        height: 26px;
      }

      .p-amount b {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <div class="nav-brand" onclick="window.location.href='/create/index.html'">
      <div class="mark" id="brandMark"></div>
      RoPeak
    </div>
    <div class="nav-right">
      <div class="theme-switch" id="themeSwitch"></div>
      <a class="nav-back" href="/create/index.html"><span id="backIcon"></span><span class="nav-back-label">Back to
          app</span></a>
      <button class="btn-google-nav" id="signInBtn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z" />
          <path fill="#FF3D00"
            d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
          <path fill="#4CAF50"
            d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.6 39.6 16.2 44 24 44z" />
          <path fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.6 5.4C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z" />
        </svg>
        <span class="btn-label">Sign in with Google</span>
      </button>
      <div class="user-row-nav" id="userMenu">
        <div class="token-balance" id="topNavTokenBalance">
          <span id="navTokenCount">–</span> tokens
        </div>
        <img class="u-avatar-nav" id="userAvatar" alt="">
        <button class="btn-signout" onclick="signOutUser()" title="Sign out"><span id="signOutIcon"></span></button>
      </div>
    </div>
  </nav>

  <div class="hero">
    <h1>Tokens</h1>
    <p>Buy them once and spend them on anything you make: an image or a UI script is <b>2 tokens</b>, a 3D model
      <b>25 to 35</b>. Nothing expires and there is no subscription.</p>
  </div>

  <div class="packages-wrap">
    <div class="packages-list" id="packagesContainer"></div>
  </div>

  <div class="note-row">Payment goes through Stripe. The tokens are on your account as soon as it clears.</div>

  <div class="status-toast" id="statusToast"></div>

  <script>
    const ICONS = {
      chevronRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
      spark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 16v6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6M4.9 19.1l4.2-4.2M14.9 9.1l4.2-4.2"/></svg>`,
      coin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 15.2c.5.7 1.4 1.1 2.5 1.1 1.8 0 2.9-.9 2.9-2.1 0-3-5.8-1.4-5.8-4.3 0-1.2 1.1-2.1 2.9-2.1 1.1 0 2 .4 2.5 1.1"/><path d="M12 6.5v11"/></svg>`,
      pack: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-6-3.46a2 2 0 0 0-2 0l-6 3.46A2 2 0 0 0 5 8v8a2 2 0 0 0 1 1.73l6 3.46a2 2 0 0 0 2 0l6-3.46A2 2 0 0 0 21 16Z"/><path d="M3.27 6.96 12 12l8.73-5.04M12 22.08V12"/></svg>`,
      crate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V21H3V8"/><path d="M1 4h22v4H1z"/><path d="M10 12h4"/></svg>`,
      gem: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20M12 3 8 9l4 12 4-12-4-6"/></svg>`,
      crown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 4 3 6-8 6 8 4-3-2 12H4Z"/></svg>`,
      image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>`,
      cube: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-6-3.46a2 2 0 0 0-2 0l-6 3.46A2 2 0 0 0 5 8v8a2 2 0 0 0 1 1.73l6 3.46a2 2 0 0 0 2 0l6-3.46A2 2 0 0 0 21 16Z"/><path d="M3.27 6.96 12 12l8.73-5.04M12 22.08V12"/></svg>`,
      layout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>`,
      lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      arrowLeft: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M5 12h14"/></svg>`,
      power: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>`,
      ropeak: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0 5.6239) scale(0.034188)"><path fill="currentColor" d="M 450.5 7 Q 463.2 6.3 468 13.5 L 549 354.5 Q 548.1 361.6 542.5 364 L 474 365 L 323 142.5 L 327 140 L 443.5 10 L 450.5 7 Z"/><path fill="currentColor" d="M 585.5 40 Q 596.3 40.3 600 47.5 Q 645.5 200.5 696 348.5 L 696 356.5 L 691.5 363 L 688.5 365 L 573.5 365 L 566 358.5 L 500 85.5 L 585.5 40 Z"/><path fill="currentColor" d="M 258.5 86 Q 268.6 86.4 272 93.5 L 446 348.5 L 447 357.5 L 440.5 365 L 301.5 365 L 299 362.5 L 254 295 L 247.5 294 L 244 296.5 L 232 311 L 228 314.5 L 180.5 365 L 12.5 365 L 6 359.5 L 5 351.5 L 16 337.5 L 250.5 89 L 258.5 86 Z"/></g></svg>`,
    };

    const WORKER_URL = "https://api.ro-peak.com";

    const firebaseConfig = {
      apiKey: "AIzaSyApNxOtHiib8fTDo5hJVN-igvt-nodGo0Q",
      authDomain: "icon-lab-622fd.firebaseapp.com",
      projectId: "icon-lab-622fd",
      storageBucket: "icon-lab-622fd.firebasestorage.app",
      messagingSenderId: "757756598032",
      appId: "1:757756598032:web:938b366449268558e13795",
      measurementId: "G-XS6Z6BMBYH"
    };

    // Icons chosen to read as a small progression of value, not a generic "best/pro/premium" ladder.
    const PACKAGES = [
      { id: "starter", tokens: 50, price: "$1.49", tag: "try it out", icon: ICONS.coin },
      { id: "basic", tokens: 110, price: "$2.99", tag: "good start", icon: ICONS.pack },
      { id: "creator", tokens: 290, price: "$6.99", tag: "most popular", icon: ICONS.crate, best: true },
      { id: "pro", tokens: 620, price: "$13.99", tag: "best value", icon: ICONS.gem },
      { id: "studio", tokens: 1300, price: "$27.99", tag: "power user", icon: ICONS.crown },
    ];

    let auth = null;
    let currentUser = null;
    let tokenBalance = null;
    let toastTimer = null;

    function init() {
      document.getElementById("brandMark").innerHTML = ICONS.ropeak;
      document.getElementById("backIcon").innerHTML = ICONS.arrowLeft;
      document.getElementById("signOutIcon").innerHTML = ICONS.power;

      initThemeSwitch();
      renderPackages();

      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      auth.onAuthStateChanged(onAuthChange);

      if (location.search.includes("paid=1")) {
        showToast("Payment received. Updating your balance…");
        pollBalanceAfterPurchase();
        window.history.replaceState(null, "", location.pathname);
      }
    }

    /* ---------- theme ---------- */
    const THEMES = [
      { id: "light", label: "Light" },
      { id: "dark", label: "Dark" },
      { id: "sea", label: "Sea" },
      { id: "forest", label: "Forest" },
      { id: "sun", label: "Sun" }
    ];
    const THEME_STORAGE_KEY = "ropeak-theme";

    function applyTheme(themeId, opts) {
      opts = opts || {};
      const valid = THEMES.some(t => t.id === themeId) ? themeId : "light";
      if (valid === "light") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", valid);
      document.querySelectorAll(".theme-dot").forEach(d => d.classList.toggle("active", d.dataset.themeId === valid));
      if (!opts.skipSave) { try { localStorage.setItem(THEME_STORAGE_KEY, valid); } catch (e) { } }
    }

    function initThemeSwitch() {
      const wrap = document.getElementById("themeSwitch");
      THEMES.forEach(t => {
        const dot = document.createElement("button");
        dot.className = "theme-dot";
        dot.type = "button";
        dot.dataset.themeId = t.id;
        dot.title = t.label;
        dot.addEventListener("click", () => applyTheme(t.id));
        wrap.appendChild(dot);
      });
      let saved = "light";
      try { saved = localStorage.getItem(THEME_STORAGE_KEY) || "light"; } catch (e) { }
      applyTheme(saved, { skipSave: true });
    }

    /* ---------- packages ---------- */
    function renderPackages() {
      const container = document.getElementById("packagesContainer");
      container.innerHTML = "";
      // Value is computed from the prices rather than described with a
      // label: "power user" tells a buyer nothing about which pack is cheaper.
      const perToken = pkg => parseFloat(pkg.price.replace(/[^0-9.]/g, "")) / pkg.tokens;
      const baseline = Math.max(...PACKAGES.map(perToken));
      PACKAGES.forEach((pkg, i) => {
        const saving = Math.round((1 - perToken(pkg) / baseline) * 100);
        const cents = (perToken(pkg) * 100).toFixed(1).replace(/\.0$/, "");
        const row = document.createElement("button");
        row.type = "button";
        row.className = "pkg-row" + (pkg.best ? " best" : "");
        row.innerHTML = `
          <span class="p-stack" aria-hidden="true">${"<i></i>".repeat(i + 1)}</span>
          <span class="p-main">
            <span class="p-amount"><b>${pkg.tokens.toLocaleString("en-US")}</b>tokens</span>
            <span class="p-meta">${cents}¢ a token${saving > 0 ? `, <em>save ${saving}%</em>` : ""}${pkg.best ? ", most picked" : ""}</span>
          </span>
          <span class="p-price">${pkg.price}</span>
        `;
        row.addEventListener("click", () => buyPackage(pkg.id));
        container.appendChild(row);
      });
    }

    /* ---------- auth ---------- */
    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => { console.error(e); showToast("Sign‑in failed.", true); });
    }
    function signOutUser() { auth.signOut(); }

    async function onAuthChange(user) {
      currentUser = user;
      const signInBtn = document.getElementById("signInBtn");
      const row = document.getElementById("userMenu");
      if (user) {
        signInBtn.style.display = "none";
        row.classList.add("show");
        document.getElementById("userAvatar").src = user.photoURL || "";
        await refreshBalance();
      } else {
        signInBtn.style.display = "flex";
        row.classList.remove("show");
        tokenBalance = null;
      }
    }

    async function authedFetch(path, options = {}) {
      if (!currentUser) return null;
      const token = await currentUser.getIdToken();
      const headers = Object.assign({ "Authorization": "Bearer " + token }, options.headers || {});
      return fetch(WORKER_URL + path, Object.assign({}, options, { headers }));
    }

    async function refreshBalance() {
      try {
        const res = await authedFetch("/me");
        if (res && res.ok) {
          const data = await res.json();
          tokenBalance = data.tokens || 0;
          document.getElementById("navTokenCount").textContent = tokenBalance;
        }
      } catch (err) { console.error("Failed to fetch balance", err); }
    }

    async function pollBalanceAfterPurchase(attempt = 0) {
      await refreshBalance();
      if (attempt < 6) setTimeout(() => pollBalanceAfterPurchase(attempt + 1), 1500);
    }

    /* ---------- checkout ---------- */
    async function buyPackage(pkgId) {
      if (!currentUser) { showToast("Sign in first to buy tokens."); document.getElementById("signInBtn").click(); return; }
      showToast("Redirecting to checkout…");
      try {
        const res = await authedFetch("/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ package: pkgId })
        });
        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || "Failed to start checkout.");
        window.location.href = data.url;
      } catch (e) {
        showToast("Error: " + e.message, true);
      }
    }

    function showToast(text, isError) {
      const el = document.getElementById("statusToast");
      el.textContent = text;
      el.className = "status-toast show" + (isError ? " error" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
    }

    init();
  </script>
</body>
